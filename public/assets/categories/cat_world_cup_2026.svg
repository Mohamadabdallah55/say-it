<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="wcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4F6C" />
      <stop offset="55%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="wcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="50%" stop-color="#F7C948" />
      <stop offset="100%" stop-color="#D98A12" />
    </linearGradient>
    <linearGradient id="wcPitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <pattern id="wcDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2" fill="#FFFDF7" opacity="0.11" />
    </pattern>
  </defs>

  <rect width="400" height="220" fill="url(#wcBg)" />
  <rect width="400" height="220" fill="url(#wcDots)" />

  <!-- Stadium floodlight beams -->
  <polygon points="45,0 135,0 210,185 110,185" fill="#FFFDF7" opacity="0.08" />
  <polygon points="355,0 265,0 190,185 290,185" fill="#FFFDF7" opacity="0.08" />

  <!-- Pitch curve at bottom -->
  <path d="M0 172 Q200 144 400 172 L400 220 L0 220 Z" fill="url(#wcPitch)" stroke="#1F112E" stroke-width="4" />
  <path d="M90 198 Q200 178 310 198" fill="none" stroke="#FFFDF7" stroke-width="3" opacity="0.45" />

  <!-- Left badge: Football -->
  <g transform="translate(72, 92) rotate(-10)">
    <circle cx="0" cy="4" r="34" fill="#1F112E" />
    <circle cx="0" cy="0" r="34" fill="#FFFDF7" stroke="#1F112E" stroke-width="4.5" />
    <polygon points="0,-12 11,-4 7,9 -7,9 -11,-4" fill="#1F112E" />
    <path d="M0,-12 L0,-31 M11,-4 L29,-10 M7,9 L19,26 M-7,9 L-19,26 M-11,-4 L-29,-10" stroke="#1F112E" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Right badge: 2026 Ribbon -->
  <g transform="translate(324, 92) rotate(8)">
    <rect x="-46" y="-22" width="92" height="48" rx="14" fill="#1F112E" transform="translate(0, 5)" />
    <rect x="-46" y="-22" width="92" height="48" rx="14" fill="#FFE047" stroke="#1F112E" stroke-width="4.5" />
    <text x="0" y="10" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#1F112E">2026</text>
  </g>

  <!-- Central Golden World Cup Trophy -->
  <g transform="translate(200, 108)">
    <!-- Soft golden aura -->
    <circle cx="0" cy="-12" r="64" fill="#FFE047" opacity="0.16" />
    <!-- Base pedestal -->
    <rect x="-36" y="42" width="72" height="18" rx="7" fill="#1F112E" />
    <rect x="-32" y="44" width="64" height="12" rx="5" fill="#15803D" stroke="#FFE047" stroke-width="2.5" />
    <rect x="-24" y="28" width="48" height="16" rx="5" fill="url(#wcGold)" stroke="#1F112E" stroke-width="4" />
    <!-- Sculpted trophy stem & figures -->
    <path d="M-18,28 C-14,6 -24,-10 -28,-24 C-32,-38 -20,-52 0,-52 C20,-52 32,-38 28,-24 C24,-10 14,6 18,28 Z" fill="url(#wcGold)" stroke="#1F112E" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Globe crown -->
    <circle cx="0" cy="-46" r="24" fill="url(#wcGold)" stroke="#1F112E" stroke-width="4.5" />
    <!-- Globe shine & latitude lines -->
    <path d="M-16,-46 Q0,-56 16,-46 M-14,-37 Q0,-45 14,-37" fill="none" stroke="#92400E" stroke-width="2.5" opacity="0.55" />
    <ellipse cx="-8" cy="-54" rx="5" ry="9" transform="rotate(-25 -8 -54)" fill="#FFFDF7" opacity="0.7" />
    <!-- Sparkles -->
    <path d="M-54,-46 L-50,-38 L-42,-34 L-50,-30 L-54,-22 L-58,-30 L-66,-34 L-58,-38 Z" fill="#FFE047" stroke="#1F112E" stroke-width="2" />
    <path d="M54,-58 L57,-52 L63,-49 L57,-46 L54,-40 L51,-46 L45,-49 L51,-52 Z" fill="#FFFDF7" stroke="#1F112E" stroke-width="2" />
  </g>
</svg>
