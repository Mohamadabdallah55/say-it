<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="vmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="vmGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="vmLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="vmDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2" fill="#FFFDF7" opacity="0.14" />
    </pattern>
  </defs>

  <rect width="400" height="220" fill="url(#vmBg)" />
  <rect width="400" height="220" fill="url(#vmDots)" />

  <!-- Subtle diagonal halftone waves -->
  <path d="M0 170 Q120 132 230 165 T400 135 L400 220 L0 220 Z" fill="#1F112E" opacity="0.28" />
  <path d="M0 190 Q140 158 260 185 T400 164 L400 220 L0 220 Z" fill="#38BDF8" opacity="0.25" />

  <!-- Left floating stopwatch badge -->
  <g transform="translate(56, 86) rotate(-10)">
    <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#FFFDF7" stroke="#1F112E" stroke-width="3.8" />
    <circle cx="0" cy="2" r="13" fill="url(#vmGold)" stroke="#1F112E" stroke-width="2.6" />
    <line x1="-4" y1="-14" x2="4" y2="-14" stroke="#1F112E" stroke-width="3" stroke-linecap="round" />
    <path d="M0 2 L0 -5 M0 2 L5 5" stroke="#1F112E" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- Right floating sparkle focus badge -->
  <g transform="translate(344, 86) rotate(10)">
    <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#FFE047" stroke="#1F112E" stroke-width="3.8" />
    <path d="M0 -13 L3.5 -3.5 L13 0 L3.5 3.5 L0 13 L-3.5 3.5 L-13 0 L-3.5 -3.5 Z" fill="#FFFDF7" stroke="#1F112E" stroke-width="2.2" stroke-linejoin="round" />
  </g>

  <!-- Central Visual Memory Camera-Eye Frame -->
  <g transform="translate(200, 110) scale(0.92)">
    <rect x="-98" y="-56" width="196" height="114" rx="26" fill="#1F112E" transform="translate(0, 7)" />
    <rect x="-98" y="-56" width="196" height="114" rx="26" fill="#FFFDF7" stroke="#1F112E" stroke-width="5" />

    <!-- Viewfinder brackets -->
    <path d="M-76 -26 L-76 -38 L-62 -38" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M76 -26 L76 -38 L62 -38" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-76 26 L-76 38 L-62 38" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M76 26 L76 38 L62 38" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylised watchful eye -->
    <path d="M-64 0 C-36 -38 36 -38 64 0 C36 38 -36 38 -64 0 Z" fill="#E0F2FE" stroke="#1F112E" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="24" fill="url(#vmLens)" stroke="#1F112E" stroke-width="4" />
    <circle cx="0" cy="0" r="10.5" fill="#1F112E" />
    <circle cx="-8" cy="-8" r="5" fill="#FFFDF7" />
    <circle cx="8" cy="7" r="2.6" fill="#BAE6FD" />

    <!-- Flash pill -->
    <rect x="44" y="-44" width="24" height="11" rx="5.5" fill="#FFE047" stroke="#1F112E" stroke-width="2.5" />
  </g>
</svg>
