<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E1B32" />
      <stop offset="55%" stop-color="#C82942" />
      <stop offset="100%" stop-color="#6B1024" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE47A" />
      <stop offset="100%" stop-color="#E5A01D" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#199B67" />
      <stop offset="100%" stop-color="#0D6E48" />
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2" fill="#FFFDF7" opacity="0.11" />
    </pattern>
  </defs>

  <rect width="400" height="220" fill="url(#bgGrad)" />
  <rect width="400" height="220" fill="url(#dots)" />

  <!-- Subtle Jordan flag ribbon diagonals -->
  <path d="M0 175 L400 130 L400 165 L0 210 Z" fill="#1F112E" opacity="0.35" />
  <path d="M0 198 L400 153 L400 220 L0 220 Z" fill="url(#emeraldGrad)" opacity="0.72" />

  <!-- Floating nostalgia badges -->
  <g transform="translate(58, 52) rotate(-10)">
    <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#FFFDF7" stroke="#1F112E" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" stroke="#1F112E" stroke-width="3" />
    <path d="M-6 2 L-1 7 L8 -5" fill="none" stroke="#1F112E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(342, 58) rotate(12)">
    <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#FFE047" stroke="#1F112E" stroke-width="4" />
    <path d="M0 -13 L3.8 -4.5 L13 -3.5 L6 3 L7.8 12.2 L0 7.5 L-7.8 12.2 L-6 3 L-13 -3.5 L-3.8 -4.5 Z" fill="#C82942" stroke="#1F112E" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Central Shopfront / Brand Emblem Medallion -->
  <g transform="translate(200, 108)">
    <!-- Shadow -->
    <rect x="-86" y="-66" width="172" height="136" rx="26" fill="#1F112E" transform="translate(0, 7)" />
    <!-- Cream card -->
    <rect x="-86" y="-66" width="172" height="136" rx="26" fill="#FFFDF7" stroke="#1F112E" stroke-width="5" />

    <!-- Striped shop awning -->
    <path d="M-86 -40 Q-86 -66 -60 -66 L60 -66 Q86 -66 86 -40 L86 -20 L-86 -20 Z" fill="#C82942" stroke="#1F112E" stroke-width="4" />
    <rect x="-52" y="-64" width="24" height="44" fill="#FFFDF7" opacity="0.92" />
    <rect x="28" y="-64" width="24" height="44" fill="#FFFDF7" opacity="0.92" />
    <rect x="-12" y="-64" width="24" height="44" fill="#199B67" />

    <!-- Scalloped awning edge -->
    <path d="M-86 -20 Q-69 -4 -52 -20 Q-35 -4 -18 -20 Q0 -4 18 -20 Q35 -4 52 -20 Q69 -4 86 -20" fill="#FFE047" stroke="#1F112E" stroke-width="4" stroke-linejoin="round" />

    <!-- Center 7-point Jordanian Star inside Golden Crest -->
    <circle cx="0" cy="24" r="34" fill="url(#goldGrad)" stroke="#1F112E" stroke-width="4" />
    <polygon
      points="0,0 5.6,12.5 19.2,9.2 12.2,21.4 23.4,30.2 9.4,31.2 10.6,45 0,36.2 -10.6,45 -9.4,31.2 -23.4,30.2 -12.2,21.4 -19.2,9.2 -5.6,12.5"
      transform="translate(0, 1) scale(0.95)"
      fill="#FFFDF7"
      stroke="#1F112E"
      stroke-width="2.6"
      stroke-linejoin="round"
    />
  </g>
</svg>
