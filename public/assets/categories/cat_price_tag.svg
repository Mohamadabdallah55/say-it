<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9F2E"/>
      <stop offset="100%" stop-color="#D95D15"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="85" y1="30" x2="235" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF4"/>
      <stop offset="100%" stop-color="#FFE69B"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE869"/>
      <stop offset="100%" stop-color="#E59A00"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bgGrad)"/>
  <circle cx="52" cy="38" r="44" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="276" cy="146" r="56" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="268" cy="36" r="18" fill="#FFE047" opacity="0.28"/>

  <!-- Subtle sparkles -->
  <path d="M58 118l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill="#FFFDF4" opacity="0.85"/>
  <path d="M262 56l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#FFFDF4" opacity="0.85"/>

  <!-- Shadow -->
  <ellipse cx="160" cy="154" rx="76" ry="12" fill="#1F112E" opacity="0.22"/>

  <!-- Price Tag Body (tilted playful 3D cartoon style matching app theme) -->
  <g transform="rotate(-8 160 90)">
    <!-- 3D Extrusion -->
    <path d="M98 44h86l52 46-52 46H98a18 18 0 0 1-18-18V62a18 18 0 0 1 18-18z" transform="translate(0 7)" fill="#1F112E"/>
    <!-- Tag Face -->
    <path d="M98 44h86l52 46-52 46H98a18 18 0 0 1-18-18V62a18 18 0 0 1 18-18z" fill="url(#tagGrad)" stroke="#1F112E" stroke-width="5" stroke-linejoin="round"/>
    <!-- Inner stitched border -->
    <path d="M104 54h75l41 36-41 36h-75a10 10 0 0 1-10-10V64a10 10 0 0 1 10-10z" stroke="#E07A16" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.7"/>
    <!-- Tag Hole -->
    <circle cx="204" cy="90" r="10" fill="#FF9F2E" stroke="#1F112E" stroke-width="4"/>
    <!-- Tag String -->
    <path d="M212 88c22-4 36-18 42-34" stroke="#1F112E" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Question Mark + JOD Badge -->
    <text x="142" y="102" text-anchor="middle" font-family="Cairo, Tajawal, sans-serif" font-weight="900" font-size="44" fill="#63349B">؟</text>
    <rect x="108" y="108" width="68" height="20" rx="10" fill="#127C56" stroke="#1F112E" stroke-width="2.5"/>
    <text x="142" y="122" text-anchor="middle" font-family="Cairo, Tajawal, sans-serif" font-weight="900" font-size="11.5" fill="#FFFFFF">دينار أردني</text>
  </g>

  <!-- Floating Gold Coin -->
  <g transform="translate(226 104)">
    <circle cx="0" cy="4" r="24" fill="#1F112E"/>
    <circle cx="0" cy="0" r="24" fill="url(#coinGrad)" stroke="#1F112E" stroke-width="4"/>
    <circle cx="0" cy="0" r="17" stroke="#FFF6C4" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="17" fill="#1F112E">JD</text>
  </g>
</svg>
