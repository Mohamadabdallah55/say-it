<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="palBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E6B38" />
      <stop offset="55%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#0A4D28" />
    </linearGradient>
    <linearGradient id="palGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="100%" stop-color="#E5A01D" />
    </linearGradient>
    <linearGradient id="palTileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2F2" />
      <stop offset="100%" stop-color="#FFE1E1" />
    </linearGradient>
    <linearGradient id="palTileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF3" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <pattern id="palDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2" fill="#FFFDF7" opacity="0.12" />
    </pattern>
  </defs>

  <rect width="400" height="220" fill="url(#palBg)" />
  <rect width="400" height="220" fill="url(#palDots)" />

  <!-- Subtle Palestinian heritage diagonal stripes -->
  <path d="M0 166 L400 120 L400 152 L0 198 Z" fill="#1F112E" opacity="0.45" />
  <path d="M0 192 L400 146 L400 176 L0 220 Z" fill="#FFFDF7" opacity="0.88" />
  <path d="M0 208 L400 162 L400 220 L0 220 Z" fill="#D92D3A" opacity="0.82" />

  <!-- Floating tatreez-inspired diamond accents centered safely inside wide board aspect ratio -->
  <g transform="translate(52, 86) rotate(-8)">
    <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#FFFDF7" stroke="#1F112E" stroke-width="3.8" />
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#D92D3A" stroke="#1F112E" stroke-width="2.4" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="3.8" fill="#FFE047" />
  </g>

  <g transform="translate(348, 88) rotate(10)">
    <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#FFE047" stroke="#1F112E" stroke-width="3.8" />
    <!-- Stylised olive branch -->
    <path d="M-7 9 Q0 -2 9 -9" fill="none" stroke="#1F112E" stroke-width="2.8" stroke-linecap="round" />
    <ellipse cx="-2" cy="-2" rx="5.5" ry="3.2" transform="rotate(-35 -2 -2)" fill="#15803D" stroke="#1F112E" stroke-width="1.8" />
    <ellipse cx="5" cy="4" rx="5.5" ry="3.2" transform="rotate(20 5 4)" fill="#15803D" stroke="#1F112E" stroke-width="1.8" />
    <circle cx="3" cy="-8" r="3.2" fill="#1F112E" />
  </g>

  <!-- Central Proverb Equation Board Card (safe vertical bounds y=56..164) -->
  <g transform="translate(200, 110) scale(0.88)">
    <rect x="-112" y="-56" width="224" height="114" rx="26" fill="#1F112E" transform="translate(0, 7)" />
    <rect x="-112" y="-56" width="224" height="114" rx="26" fill="#FFFDF7" stroke="#1F112E" stroke-width="5" />

    <!-- Heritage top band -->
    <path d="M-112 -32 Q-112 -56 -88 -56 L88 -56 Q112 -56 112 -32 L112 -22 L-112 -22 Z" fill="#1F112E" />
    <polygon points="-70,-39 -62,-47 -54,-39 -62,-31" fill="#D92D3A" />
    <polygon points="-24,-39 -16,-47 -8,-39 -16,-31" fill="#15803D" />
    <polygon points="8,-39 16,-47 24,-39 16,-31" fill="#FFE047" />
    <polygon points="54,-39 62,-47 70,-39 62,-31" fill="#D92D3A" />

    <!-- Left Rebus Tile: Heart -->
    <rect x="-90" y="-11" width="66" height="56" rx="16" fill="url(#palTileA)" stroke="#1F112E" stroke-width="3.5" />
    <path d="M-57 31 C-71 21 -74 9 -65 2 C-60 -2 -57 3 -57 7 C-57 3 -54 -2 -49 2 C-40 9 -43 21 -57 31 Z" fill="#D92D3A" stroke="#1F112E" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Plus badge -->
    <rect x="-17" y="6" width="22" height="22" rx="7" fill="#FFE047" stroke="#1F112E" stroke-width="2.8" />
    <path d="M-6 11 L-6 23 M-12 17 L0 17" stroke="#1F112E" stroke-width="3" stroke-linecap="round" />

    <!-- Right Rebus Tile: Proverb Scroll -->
    <rect x="12" y="-11" width="78" height="56" rx="16" fill="url(#palTileB)" stroke="#1F112E" stroke-width="3.5" />
    <rect x="28" y="0" width="46" height="34" rx="7" fill="url(#palGold)" stroke="#1F112E" stroke-width="2.8" />
    <line x1="36" y1="11" x2="66" y2="11" stroke="#1F112E" stroke-width="2.8" stroke-linecap="round" />
    <line x1="40" y1="19" x2="62" y2="19" stroke="#1F112E" stroke-width="2.8" stroke-linecap="round" />
    <line x1="46" y1="27" x2="58" y2="27" stroke="#1F112E" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
