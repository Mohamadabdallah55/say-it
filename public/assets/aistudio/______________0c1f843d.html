lor:#000}.controls,button,.legend{display:none}.quiz{background:#fff;box-shadow:none;border:1px solid #ccc}}</style></head><body><main><div class="top"><div><h1>مسابقة الخلفاء الراشدين</h1><p class="sub">90 سؤالًا • أسماء الخلفاء مختلطة • الإجابة للمشرف فقط</p></div><div class="row"><label>المستوى: <select id="filter"><option value="all">الجميع</option><option value="200">200 نقطة</option><option value="400">400 نقطة</option><option value="600">600 نقطة</option></select></label><span class="tag" id="badge">200 نقطة</span></div></div><section class="quiz"><div class="top"><span class="num" id="count">السؤال 1 من 90</span><span class="tag" id="id">RASHIDUN_001</span></div><div class="question" id="question"></div><div class="answer" id="answer" hidden><strong id="ans"></strong><p id="explain"></p><div id="person" class="sub"></div><a id="source" href="#" target="_blank" rel="noopener">فتح المرجع</a></div><div class="controls"><button class="primary" id="reveal">إظهار الإجابة</button><button id="prev">السابق</button><button id="next">التالي</button><button id="random">سؤال عشوائي</button><button id="shuffle">خلط جديد</button></div><div class="count" id="remaining"></div></section><p class="legend">يعمل العرض دون إنترنت لأن الأسئلة محفوظة داخله. روابط المصادر الخارجية فقط تحتاج إنترنت. مفاتيح التنقل: السهم الأيمن والسهم الأيسر، والمسافة لإظهار الإجابة.</p></main><script>const DATA=[{"id": "RASHIDUN_001", "score": 200, "question": "ما الحدث الذي جُعل مرجعًا لبدء عدّ السنوات في التقويم الإسلامي المعتمد زمن عمر؟", "answer": "الهجرة النبوية", "explanation": "اختيرت الهجرة أساسًا لترقيم السنين.", "caliph": "عمر بن الخطاب", "source_url": "https://www.islam.museum/en/invention/hijri-era-administrative-dating/"}, {"id": "RASHIDUN_002", "score": 400, "question": "ما الفريضة المالية التي رفض بعض العرب أداءها بعد وفاة النبي ﷺ فواجههم أبو بكر؟", "answer": "الزكاة", "explanation": "أصرّ أبو بكر على عدم الفصل بين الصلاة والزكاة في الواجبات.", "caliph": "أبو بكر الصديق", "source_url": "https://sunnah.com/bukhari/24"}, {"id": "RASHIDUN_003", "score": 600, "question": "من ابن علي الذي سأل أباه عن أفضل الناس بعد النبي ﷺ، فأجابه أبوه بذكر أبي بكر ثم عمر؟", "answer": "محمد بن الحنفية", "explanation": "روى محمد بن الحنفية هذا السؤال عن أبيه علي رضي الله عنه.", "caliph": "علي بن أبي طالب", "source_url": "https://sunnah.com/bukhari/62"}, {"id": "RASHIDUN_004", "score": 400, "question": "من الصحابي الذي اقترح على أبي بكر جمع القرآن في صحف بعد معركة اليمامة؟", "answer": "عمر بن الخطاب", "explanation": "طلب عمر جمع القرآن خشية ضياع شيء بموت الحفاظ.", "caliph": "أبو بكر الصديق", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_005", "score": 200, "question": "ما كنية الخليفة عمر بن الخطاب رضي الله عنه؟", "answer": "أبو حفص", "explanation": "هي كنيته المشهورة في كتب التراجم.", "caliph": "عمر بن الخطاب", "source_url": "https://www.islam.museum/en/person/umar-ibn-al-khattab/"}, {"id": "RASHIDUN_006", "score": 600, "question": "ماذا فعل عثمان بالصحف التي تسلّمها من حفصة بعد انتهاء نسخ المصاحف؟", "answer": "أعادها إلى حفصة", "explanation": "أعيدت الصحف إلى صاحبتها بعد الانتهاء من نسخها.", "caliph": "عثمان بن عفان", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_007", "score": 200, "question": "من ثاني الخلفاء الراشدين بعد أبي بكر؟", "answer": "عمر بن الخطاب", "explanation": "تولى الخلافة عام 13هـ بعد أبي بكر.", "caliph": "عمر بن الخطاب", "source_url": "https://www.islam.museum/en/person/umar-ibn-al-khattab/"}, {"id": "RASHIDUN_008", "score": 600, "question": "ما الاعتراض الذي أبداه أبو بكر في أول الأمر عندما اقترح عمر جمع المصحف؟", "answer": "كيف نفعل شيئًا لم يفعله رسول الله ﷺ؟", "explanation": "تردد أولًا لكون العمل لم يُنفذ بهذه الصورة في حياة النبي ﷺ، ثم اقتنع به.", "caliph": "أبو بكر الصديق", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_009", "score": 400, "question": "ما المقصود من إرسال عثمان مصاحف إلى الأمصار بدل الاكتفاء بنسخة في المدينة؟", "answer": "توحيد مرجع المصاحف في الأمصار وتقليل اختلاف القراءة", "explanation": "أُرسلت نسخ معيارية إلى الأقاليم لتكون مرجعًا.", "caliph": "عثمان بن عفان", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_010", "score": 600, "question": "في أي عام هجري وقعت النهروان في خلافة علي؟", "answer": "38هـ", "explanation": "المعروف تاريخيًا أنها وقعت عام 38هـ.", "caliph": "علي بن أبي طالب", "source_url": "https://www.iranicaonline.org/articles/ali-b-abi-taleb/"}, {"id": "RASHIDUN_011", "score": 200, "question": "في أي عام هجري بدأت خلافة عثمان بن عفان؟", "answer": "23هـ", "explanation": "كانت خلافته من نحو 23هـ إلى 35هـ.", "caliph": "عثمان بن عفان", "source_url": "https://www.islam.museum/en/person/uthman-ibn-affan/"}, {"id": "RASHIDUN_012", "score": 400, "question": "أي سورة تضمنت الآية التي تلاها أبو بكر لتذكير المسلمين أن النبي ﷺ رسول قد خلت من قبله الرسل؟", "answer": "سورة آل عمران", "explanation": "استشهد بالآية 144 من آل عمران بعد وفاة النبي ﷺ.", "caliph": "أبو بكر الصديق", "source_url": "https://quran.com/3/144"}, {"id": "RASHIDUN_013", "score": 200, "question": "من الخليفة الذي اشتهر بتنظيم الدواوين وسجلات العطاء؟", "answer": "عمر بن الخطاب", "explanation": "أنشئت سجلات للجند والأعطيات في عهده.", "caliph": "عمر بن الخطاب", "source_url": "https://www.islam.museum/en/person/umar-ibn-al-khattab/"}, {"id": "RASHIDUN_014", "score": 600, "question": "أي نبي شُبّهت منزلته عند موسى بمنزلة علي عند النبي ﷺ في الحديث المشهور؟", "answer": "هارون عليه السلام", "explanation": "في الحديث: منزلة علي من النبي ﷺ كمنزلة هارون من موسى، إلا أنه لا نبي بعده.", "caliph": "علي بن أبي طالب", "source_url": "https://sunnah.com/bukhari/62"}, {"id": "RASHIDUN_015", "score": 400, "question": "أي معركة كانت من دوافع جمع القرآن في عهد أبي بكر بسبب استشهاد عدد من القراء؟", "answer": "معركة اليمامة", "explanation": "وردت قصة ذلك في صحيح البخاري في باب جمع القرآن.", "caliph": "أبو بكر الصديق", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_016", "score": 600, "question": "قرب أي مدينة عراقية وقعت وقعة الجمل سنة 36هـ؟", "answer": "البصرة", "explanation": "تُذكر البصرة موقعًا لوقعة الجمل.", "caliph": "علي بن أبي طالب", "source_url": "https://www.islam.museum/en/event/battle-of-the-camel/"}, {"id": "RASHIDUN_017", "score": 200, "question": "في عهد أي خليفة بدأت فتوحات المسلمين لمصر بقيادة عمرو بن العاص؟", "answer": "عمر بن الخطاب", "explanation": "قاد عمرو بن العاص الحملة على مصر في خلافة عمر.", "caliph": "عمر بن الخطاب", "source_url": "https://www.worldhistory.org/Umar/"}, {"id": "RASHIDUN_018", "score": 400, "question": "كم شخصًا ذكرهم حديث أنس في لجنة عثمان لنسخ المصاحف؟", "answer": "أربعة", "explanation": "زيد وثلاثة من قريش.", "caliph": "عثمان بن عفان", "source_url": "https://sunnah.com/bukhari/66"}, {"id": "RASHIDUN_019", "score": 600, "question": "في أي عام هجري وقعت صفّين بحسب التأريخ الشائع؟", "answer": "37هـ", "explanation": "تؤرخ صفين عادة بسنة 37هـ.", "caliph": "علي بن أبي طالب", "source_url": "https://www.iranicaonline.org/articles/ali-b-abi-taleb/"}, {"id": "RASHIDUN_020", "score": 200, "question": "ما لقب عمر بن الخطاب المشهور في السيرة؟", "answer": "الفاروق", "explanation": "اشتهر بلقب الفاروق.", "caliph": "عمر بن الخطاب", "source_url": "https://www.islam.museum/en/person/umar-ibn-al-khattab/"}, {"id": "RASHIDUN_021", "score": 400, "question": "في أي سنتين هجريتين كانت بداية خلافة أبي بكر ونهايتها؟", "answer": "من 11هـ إلى 13هـ", "explanation": "استمرت خلافته قرابة عامين.", "caliph": "أبو بكر الصديق", "source_url": "https://www.islam.museum/en/person/abu-bakr/"}, {"id": "RASHIDUN_022", "score": 200, "question": "أي مسجد في المدينة وسّعه عثمان خلال خلافته؟", "answer": "المسجد النبوي", "explanation": "شهد المسجد النبوي توسعة في عهده.", "caliph": "عثمان بن عفان", "source_url": "https://www.islam.museum/en/person/uthman-ibn-affan/"}, {"id": "RASHIDUN_023", "score": 600, "question": "هل كانت خطوة عمر في التاريخ الهجري اختراع أسماء الشهور أم اعتماد مرجع موحّد لسنوات المكاتبات؟", "answer": "اعتماد مرجع موحّد لسنوات المكاتبات", "explanation": "كانت الشهور القمرية معروفة؛ الجديد هو ت
