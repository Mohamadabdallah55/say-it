name: Verify challenge arena
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/fourPicturesQuestions*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-challenge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'server/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Four-picture regression tests
        run: bunx tsx --test server/fourPicturesQuestions.test.ts
      - name: Media and room regression tests
        run: bunx tsx --test src/game/guessSound.test.ts src/game/visualMemory.test.ts src/game/jordanNostalgia.test.ts src/game/arenaClock.test.ts src/game/engine.test.ts src/game/categoryProgress.test.ts src/utils/roomConnection.test.ts
