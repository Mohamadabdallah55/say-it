name: Verify challenge arena
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/fourPicturesQuestions*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-challenge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'server/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Measure initial JavaScript and lazy chunks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const manifest = JSON.parse(fs.readFileSync('dist/.vite/manifest.json', 'utf8'));
          const visited = new Set();
          const initial = new Set();
          function visit(key) {
            if (visited.has(key)) return;
            visited.add(key);
            const chunk = manifest[key];
            if (!chunk) throw new Error('Unknown manifest key: ' + key);
            if (/\.(m?js)$/.test(chunk.file)) initial.add(chunk.file);
            for (const dependency of chunk.imports || []) visit(dependency);
          }
          for (const [key, chunk] of Object.entries(manifest)) if (chunk.isEntry) visit(key);
          if (!initial.size) throw new Error('No initial JavaScript entries found');
          const size = file => {
            const data = fs.readFileSync('dist/' + file);
            return { raw: data.length, gzip: gzipSync(data).length };
          };
          const files = [...initial].map(file => ({ file, ...size(file) }));
          const totals = files.reduce((total, file) => ({
            raw: total.raw + file.raw, gzip: total.gzip + file.gzip,
          }), { raw: 0, gzip: 0 });
          console.log('Initial JS files:', JSON.stringify(files, null, 2));
          console.log('Initial JS totals (bytes):', JSON.stringify(totals));
          console.log('Lazy JS files:', JSON.stringify([...new Set(Object.values(manifest).map(c => c.file).filter(f => /\.(m?js)$/.test(f) && !initial.has(f)))].map(file => ({ file, ...size(file) })).sort((a,b) => b.raw-a.raw), null, 2));
          NODE
      - name: TypeScript
        run: bun run lint
      - name: Four-picture regression tests
        run: bunx tsx --test server/fourPicturesQuestions.test.ts
      - name: Remote deck recovery regression tests
        run: bunx tsx --test src/game/remoteDecks.test.ts
      - name: Media and room regression tests
        run: bunx tsx --test src/game/guessSound.test.ts src/game/visualMemory.test.ts src/game/jordanNostalgia.test.ts src/game/arenaClock.test.ts src/game/engine.test.ts src/game/categoryProgress.test.ts src/utils/roomConnection.test.ts
